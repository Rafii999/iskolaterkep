<!DOCTYPE html>
<html lang="hu" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMSZKI Iskolatérkép</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0B0F19; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        body {
            overflow-y: auto;
            min-height: 100vh;
            background: #0B0F19;
        }
        
        .glass-panel {
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(59, 130, 246, 0.15);
        }
        
        .room-shape {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .room-shape:hover {
            filter: brightness(1.3) drop-shadow(0 0 8px rgba(6, 182, 212, 0.6));
        }
        
        .selected-room {
            stroke: #22D3EE !important;
            stroke-width: 3 !important;
            filter: drop-shadow(0 0 15px rgba(6, 182, 212, 0.9)) brightness(1.2) !important;
            animation: pulse 1.5s ease-in-out infinite alternate;
        }
        
        @keyframes pulse {
            from { filter: drop-shadow(0 0 5px rgba(6,182,212,0.5)) brightness(1.2); }
            to { filter: drop-shadow(0 0 20px rgba(6,182,212,1)) brightness(1.3); }
        }
        
        .room-item { 
            transition: all 0.2s; 
            border-left: 3px solid transparent;
        }
        .room-item:hover { 
            background: rgba(59, 130, 246, 0.2); 
            border-left-color: #3B82F6;
        }
        .room-item.active { 
            background: rgba(6, 182, 212, 0.3); 
            border-left-color: #06B6D4;
        }
        
        .map-container {
            position: sticky;
            top: 80px;
            height: calc(100vh - 100px);
            display: flex;
            align-items: flex-start;
            justify-content: center;
            overflow-y: auto;
        }
        #svgContainer { width: 100%; display: flex; justify-content: center; }
        
        .building-outline {
            fill: #1E293B;
            fill-opacity: 0.25;
            stroke: #475569;
            stroke-width: 3;
            stroke-linejoin: round;
        }
    </style>
</head>

            { id: "F1_148", roomNo: "148", name: "Horváth Zoltán", floor: "1. Emelet", floorNum: 1, teacher: "Horváth Zoltán", capacity: "-", desc: "Tanterem – Horváth Zoltán", equipment: [], route: ["Lépcső", "1. emelet"], x: 695, y: 583, w: 115, h: 55, color: "#06B6D4" },
            { id: "F1_149", roomNo: "149", name: "1. emeleti terem 149", floor: "1. Emelet", floorNum: 1, teacher: "-", capacity: "-", desc: "1. emeleti terem 149", equipment: [], route: ["Lépcső", "1. emelet"], x: 80, y: 646, w: 115, h: 55, color: "#06B6D4" },
            { id: "F1_181", roomNo: "181", name: "Bodahelyi Éva", floor: "1. Emelet", floorNum: 1, teacher: "Bodahelyi Éva", capacity: "-", desc: "Tanterem – Bodahelyi Éva", equipment: [], route: ["Lépcső", "1. emelet"], x: 203, y: 646, w: 115, h: 55, color: "#06B6D4" },
            { id: "F1_182", roomNo: "182", name: "Hegyiné Z. Szilvia", floor: "1. Emelet", floorNum: 1, teacher: "Hegyiné Z. Szilvia", capacity: "-", desc: "Tanterem – Hegyiné Z. Szilvia", equipment: [], route: ["Lépcső", "1. emelet"], x: 326, y: 646, w: 115, h: 55, color: "#06B6D4" },
            { id: "F1_183", roomNo: "183", name: "1. emeleti terem 183", floor: "1. Emelet", floorNum: 1, teacher: "-", capacity: "-", desc: "1. emeleti terem 183", equipment: [], route: ["Lépcső", "1. emelet"], x: 449, y: 646, w: 115, h: 55, color: "#06B6D4" },
            { id: "F1_184", roomNo: "184", name: "Nagy Krisztina", floor: "1. Emelet", floorNum: 1, teacher: "Nagy Krisztina", capacity: "-", desc: "Tanterem – Nagy Krisztina", equipment: [], route: ["Lépcső", "1. emelet"], x: 572, y: 646, w: 115, h: 55, color: "#06B6D4" },
            { id: "F1_186", roomNo: "186", name: "Barta Ilona", floor: "1. Emelet", floorNum: 1, teacher: "Barta Ilona", capacity: "-", desc: "Tanterem – Barta Ilona", equipment: [], route: ["Lépcső", "1. emelet"], x: 695, y: 646, w: 115, h: 55, color: "#06B6D4" },
            { id: "F1_187", roomNo: "187", name: "Tanterem", floor: "1. Emelet", floorNum: 1, teacher: "-", capacity: "-", desc: "Tanterem", equipment: [], route: ["Lépcső", "1. emelet"], x: 80, y: 709, w: 115, h: 55, color: "#06B6D4" },
            
            
            { id: "212", name: "Angol (212)", floor: "2. Emelet", floorNum: 2, teacher: "Váni", capacity: "28", desc: "Angol nyelvi terem", equipment: ["Hangfalak"], route: ["Lépcső", "2. emelet", "Balra"], x: 100, y: 100, w: 100, h: 75, color: "#8B5CF6" },
            { id: "223", name: "Angol (223)", floor: "2. Emelet", floorNum: 2, teacher: "Váni", capacity: "28", desc: "Angol nyelvi terem", equipment: ["Hangfalak"], route: ["Lépcső", "2. emelet", "Balra"], x: 210, y: 100, w: 95, h: 75, color: "#8B5CF6" },
            { id: "236", name: "Fizika", floor: "2. Emelet", floorNum: 2, teacher: "MI", capacity: "28", desc: "Fizika labor", equipment: ["Kísérletek", "Műszerek"], route: ["Lépcső", "2. emelet", "Jobbra"], x: 315, y: 100, w: 115, h: 75, color: "#8B5CF6" },
            
            { id: "306", name: "Matematika (306)", floor: "3. Emelet", floorNum: 3, teacher: "KK", capacity: "32", desc: "Matematika terem", equipment: ["Tábla"], route: ["Lépcső", "3. emelet", "Jobbra"], x: 440, y: 100, w: 115, h: 75, color: "#7C3AED" },
            
            { id: "AULA", name: "Aula", floor: "Földszint", floorNum: 0, teacher: "-", capacity: "120", desc: "Főaula", equipment: ["Padok"], route: ["Főbejárat", "Belépés"], x: 240, y: 360, w: 180, h: 120, color: "#2563EB" },
            { id: "PORTA", name: "Porta", floor: "Földszint", floorNum: 0, teacher: "Portás", capacity: "-", desc: "Portaszolgálat", equipment: ["Kamera"], route: ["Főbejárat"], x: 140, y: 400, w: 80, h: 60, color: "#1E40AF" }
        ];

        let selectedRoomId = null;

        function init() {
            renderMap();
            renderRoomList();
        }

        function layoutRooms() {
            const COLS = 7, CW = 104, CH = 56, GAP = 6, LEFT = 64, PAD = 16, BAND_GAP = 18, HEAD = 26;
            const bands = [
                { label: "2-3. EMELET", test: r => r.floorNum >= 2 },
                { label: "1. EMELET",   test: r => r.floorNum === 1 },
                { label: "FÖLDSZINT",   test: r => r.floorNum === 0, entrance: true }
            ];
            const sortFn = (a, b) => {
                const an = parseInt(a.roomNo || a.id) || 0, bn = parseInt(b.roomNo || b.id) || 0;
                return an - bn || String(a.roomNo || a.id).localeCompare(String(b.roomNo || b.id));
            };
            let y = 20;
            const out = [];
            bands.forEach(band => {
                const rooms = allRooms.filter(band.test).sort(sortFn);
                const rows = Math.ceil(rooms.length / COLS);
                const bandH = HEAD + rows * (CH + GAP) + PAD + (band.entrance ? 40 : 0);
                rooms.forEach((r, i) => {
                    r.x = LEFT + (i % COLS) * (CW + GAP);
                    r.y = y + HEAD + Math.floor(i / COLS) * (CH + GAP);
                    r.w = CW; r.h = CH;
                });
                out.push({ label: band.label, y, h: bandH, entrance: band.entrance });
                y += bandH + BAND_GAP;
            });
            return { bands: out, width: LEFT + COLS * (CW + GAP) + PAD, height: y };
        }

        function renderMap() {
            const container = document.getElementById('svgContainer');
            const lay = layoutRooms();
            const width = lay.width;
            const height = lay.height;

            let svg = `
                <svg width="100%" viewBox="0 0 ${width} ${height}" style="max-width:${width}px; height:auto; filter: drop-shadow(0 10px 30px rgba(0,0,0,0.5));">
                    <defs>
                        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1"/>
                        </pattern>
                    </defs>
                    <rect width="${width}" height="${height}" fill="#0B0F19" rx="16"/>
                    <rect width="${width}" height="${height}" fill="url(#grid)" opacity="0.3"/>
            `;

            lay.bands.forEach(b => {
                svg += `
                    <rect x="8" y="${b.y}" width="${width - 16}" height="${b.h}" class="building-outline" rx="10"/>
                    <text x="34" y="${b.y + b.h / 2}" fill="#64748B" font-size="11" font-weight="bold" text-anchor="middle"
                          transform="rotate(-90 34 ${b.y + b.h / 2})">${b.label}</text>
                `;
                if (b.entrance) {
                    const cx = width / 2;
                    svg += `
                        <rect x="${cx - 35}" y="${b.y + b.h - 34}" width="70" height="10" fill="#06B6D4" opacity="0.8" rx="3"/>
                        <text x="${cx}" y="${b.y + b.h - 8}" fill="#94A3B8" font-size="12" font-weight="600" text-anchor="middle">Főbejárat (Görgey Artúr u.)</text>
                    `;
                }
            });

            allRooms.forEach(room => {
                const isSelected = selectedRoomId === room.id;
                const strokeWidth = isSelected ? 4 : 2;
                const strokeColor = isSelected ? '#22D3EE' : '#1E293B';
                const label = room.roomNo || room.id;
                const nm = room.name.length > 15 ? room.name.substring(0, 13) + '..' : room.name;

                svg += `
                    <g id="room-${room.id}" class="room-group" onclick="selectRoom('${room.id}')">
                        <rect x="${room.x}" y="${room.y}" width="${room.w}" height="${room.h}"
                              fill="${room.color}" stroke="${strokeColor}" stroke-width="${strokeWidth}"
                              rx="6" class="room-shape ${isSelected ? 'selected-room' : ''}"/>
                        <text x="${room.x + room.w/2}" y="${room.y + room.h/2 - 3}"
                              fill="white" font-size="12" font-weight="700" text-anchor="middle"
                              font-family="Inter" pointer-events="none">${label}</text>
                        <text x="${room.x + room.w/2}" y="${room.y + room.h/2 + 12}"
                              fill="rgba(255,255,255,0.9)" font-size="9" font-weight="500" text-anchor="middle"
                              font-family="Inter" pointer-events="none">${nm}</text>
                    </g>
                `;
            });

            svg += `</svg>`;
            container.innerHTML = svg;
        }

        function renderRoomList() {
            const container = document.getElementById('roomList');
            container.innerHTML = '';
            
            const floors = ['Földszint', '1. Emelet', '2. Emelet', '3. Emelet'];
            const floorColors = ['bg-blue-500', 'bg-cyan-500', 'bg-violet-500', 'bg-purple-600'];
            
            floors.forEach((floorName, idx) => {
                const rooms = allRooms.filter(r => r.floor === floorName);
                if (rooms.length === 0) return;
                
                const floorDiv = document.createElement('div');
                floorDiv.className = "mb-4";
                floorDiv.innerHTML = `
                    <div class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2 px-2 flex items-center">
                        <span class="w-2 h-2 rounded-full mr-2 ${floorColors[idx]}"></span>
                        ${floorName}
                    </div>
                `;
                
                rooms.sort((a,b) => {
                        const an = parseInt(a.roomNo || a.id) || 0;
                        const bn = parseInt(b.roomNo || b.id) || 0;
                        return an - bn || String(a.roomNo || a.id).localeCompare(String(b.roomNo || b.id));
                    }).forEach(room => {
                    const item = document.createElement('div');
                    item.className = `room-item p-3 rounded-lg cursor-pointer mb-1 ${selectedRoomId === room.id ? 'active' : 'bg-slate-900/40'}`;
                    item.onclick = () => selectRoom(room.id);
                    item.innerHTML = `
                        <div class="flex items-center justify-between">
                            <div>
                                <span class="text-xs font-bold text-cyan-400">${room.roomNo || room.id}</span>
                                <p class="text-sm font-medium text-slate-200 leading-tight mt-0.5">${room.name}</p>
                            </div>
                            <i class="fa-solid fa-chevron-right text-xs text-slate-600"></i>
                        </div>
                    `;
                    floorDiv.appendChild(item);
                });
                
                container.appendChild(floorDiv);
            });
        }

        function selectRoom(roomId) {
            const room = allRooms.find(r => r.id === roomId);
            if (!room) return;
            
            selectedRoomId = roomId;
            renderMap();
            renderRoomList();
            showInfo(room);
        }

        function showInfo(room) {
            const panel = document.getElementById('infoPanel');
            
            document.getElementById('infoRoomId').textContent = room.roomNo || room.id;
            document.getElementById('infoRoomName').textContent = room.name;
            document.getElementById('infoFloor').textContent = room.floor;
            document.getElementById('infoDesc').textContent = room.desc;
            document.getElementById('infoTeacher').textContent = room.teacher;
            document.getElementById('infoCapacity').textContent = room.capacity + (room.capacity !== '-' ? ' fő' : '');
            
            const eqContainer = document.getElementById('infoEquipment');
            eqContainer.innerHTML = '';
            room.equipment.forEach(eq => {
                const tag = document.createElement('span');
                tag.className = "px-2 py-1 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-300 font-medium";
                tag.textContent = eq;
                eqContainer.appendChild(tag);
            });
            
            const routeContainer = document.getElementById('infoRoute');
            routeContainer.innerHTML = '';
            room.route.forEach((step, idx) => {
                const stepDiv = document.createElement('div');
                stepDiv.className = "flex items-start space-x-2";
                stepDiv.innerHTML = `
                    <span class="flex-shrink-0 w-5 h-5 rounded-full bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center text-xs font-bold text-white">${idx + 1}</span>
                    <span class="leading-tight">${step}</span>
                `;
                routeContainer.appendChild(stepDiv);
            });
            
            panel.classList.remove('translate-x-full');
        }

        function closeInfo() {
            document.getElementById('infoPanel').classList.add('translate-x-full');
            selectedRoomId = null;
            renderMap();
            renderRoomList();
        }

        function resetView() {
            closeInfo();
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const items = document.querySelectorAll('.room-item');
            const floors = document.querySelectorAll('#roomList > div');
            
            items.forEach(item => {
                const text = item.textContent.toLowerCase();
                item.style.display = text.includes(query) ? 'flex' : 'none';
            });
            
            floors.forEach(floor => {
                const visibleRooms = floor.querySelectorAll('.room-item:not([style*="display: none"])');
                floor.style.display = visibleRooms.length > 0 ? 'block' : 'none';
            });
        });

        window.onload = init;
    </script>
</body>
</html>
