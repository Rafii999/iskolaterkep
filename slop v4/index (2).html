<style>
:root{--bg:#eef3fa;--pn:#fff;--ln:#dfe7f2;--tx:#0f1f3d;--mu:#5d6d88;--bl:#1d4ed8;--bl2:#eaf1ff;--f:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13.5px/1.4 var(--f);overflow:hidden}
button,input,select{font:inherit;color:inherit}
#map{position:fixed;inset:0;cursor:grab;touch-action:none}#map.d{cursor:grabbing}
svg{width:100%;height:100%;display:block}
.z{fill:rgba(37,99,235,.12);stroke:#fff;stroke-width:2;stroke-linejoin:round;cursor:pointer;transition:stroke .2s}
.z:hover{stroke:#93c5fd;stroke-width:3}.z.on{stroke:#2563eb;stroke-width:3.5}
.zl{fill:#fff;font:700 11px var(--f);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:rgba(10,30,80,.85);stroke-width:3px}
.zs{font:600 9px var(--f);fill:#dbeafe}
.pin{pointer-events:none}.pin rect{fill:#1d4ed8;stroke:#fff;stroke-width:1.5}.pin text{fill:#fff;font:700 10px var(--f);text-anchor:middle}
.pn{position:fixed;background:var(--pn);border:1px solid var(--ln);border-radius:14px;box-shadow:0 8px 30px rgba(20,50,110,.16);display:flex;flex-direction:column;min-height:0}
#L{left:14px;top:14px;bottom:14px;width:320px}
#R{right:14px;top:14px;bottom:14px;width:430px;transform:translateX(calc(100% + 24px));transition:transform .28s ease}#R.o{transform:none}
.hd{padding:14px 14px 10px}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.brand img,.lb{width:52px;height:52px;border-radius:10px;object-fit:contain;flex:none}
.lb{background:var(--bl);color:#fff;display:grid;place-items:center;font:800 22px var(--f)}
h1{margin:0;font-size:17px;line-height:1.15}h1 small{display:block;color:var(--mu);font:500 12px var(--f);margin-top:3px}
.tabs{display:flex;background:var(--bl2);border-radius:10px;padding:3px;gap:2px}.tabs button{flex:1;padding:6px 4px;border:0;background:transparent;border-radius:8px;cursor:pointer;color:var(--mu);font-weight:600}
.tabs button.on{background:#fff;color:var(--bl);box-shadow:0 1px 4px rgba(20,50,110,.18)}
input[type=search]{width:100%;margin-top:10px;padding:9px 12px;background:#f7f9fd;border:1px solid var(--ln);border-radius:10px;outline:none}input:focus{border-color:var(--bl);background:#fff}
.chs{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}.chs:empty{display:none}.ch{padding:3px 10px;font-size:12px;border-radius:99px;border:1px solid var(--ln);background:#fff;cursor:pointer;color:var(--mu)}
.ch.on{background:var(--bl);border-color:var(--bl);color:#fff}
.sl{display:flex;gap:6px;align-items:center;margin-top:10px;font-size:12px;color:var(--mu)}
select{background:#fff;border:1px solid var(--ln);border-radius:8px;padding:4px 6px;max-width:112px}
.sl button{margin-left:auto;padding:4px 11px;border-radius:8px;border:0;background:var(--bl);color:#fff;cursor:pointer;font-weight:600}
#nw{font-size:12px;color:var(--mu);margin-top:8px}
#list{flex:1;overflow:auto;padding:4px 8px;border-top:1px solid var(--ln)}
.it{display:flex;gap:9px;align-items:center;width:100%;padding:8px 9px;border:0;background:transparent;border-radius:9px;text-align:left;cursor:pointer}
.it:hover{background:#f2f6fd}.it.on{background:var(--bl2)}
.it b{min-width:44px;font-variant-numeric:tabular-nums}.it span{color:var(--mu);font-size:12.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid #b8c6dd}.dot.b{background:var(--bl);border-color:var(--bl)}
.ft{padding:8px 14px;border-top:1px solid var(--ln);color:var(--mu);font-size:11.5px}
.dh{padding:16px 14px 12px;border-bottom:1px solid var(--ln);display:flex;gap:10px}.dh h2{margin:0;font-size:21px}.dh p{margin:3px 0 0;color:var(--mu)}
.x{margin-left:auto;border:0;background:none;font-size:24px;cursor:pointer;color:var(--mu);height:34px;width:34px;border-radius:8px}.x:hover{background:var(--bl2)}
.db{flex:1;overflow:auto;padding:14px}
.now{padding:10px 12px;border-radius:10px;background:var(--bl2);border:1px solid #c5d8fb;margin-bottom:14px}.now.f{background:#f4f7fb;border-color:var(--ln);color:var(--mu)}
.g{display:grid;grid-template-columns:36px repeat(5,1fr);gap:3px;font-size:10.5px}
.g>i{font-style:normal;color:var(--mu);font-size:9.5px;text-align:right;padding:3px 3px 0 0;font-variant-numeric:tabular-nums}
.g>b{text-align:center;color:var(--mu);font-weight:600;padding-bottom:2px}
.c{min-height:36px;border-radius:6px;background:#f6f8fc;padding:2px;display:flex;flex-direction:column;gap:2px}.c.now{outline:2px solid var(--bl);background:#fff}
.e{border-radius:5px;padding:2px 4px;border-left:3px solid;overflow:hidden}.e b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#0f2a63}.e u{text-decoration:none;color:#4a5d80;font-size:9.5px;white-space:nowrap;display:block;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:8px;align-items:center;margin:0 0 14px;color:var(--mu)}
.tg{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--bl2);margin:0 4px 4px 0;cursor:pointer;color:var(--bl);font-weight:600}.tg:hover{background:#d9e6ff}
#zc{position:fixed;left:346px;bottom:16px;display:flex;flex-direction:column;gap:6px}#zc button{width:36px;height:36px;border-radius:10px;border:1px solid var(--ln);background:#fff;cursor:pointer;font-size:18px;color:var(--bl);box-shadow:0 2px 8px rgba(20,50,110,.14)}
@media(max-width:860px){#L{right:14px;width:auto;top:auto;height:48vh}#R{left:14px;width:auto;top:auto;height:72vh}#zc{left:auto;right:14px;bottom:calc(48vh + 22px)}}
</style></head><body>

 else if(m==="t"){title=D.T[st.sel][0];sub=D.T[st.sel][1]+" · "+es.length+" óra/hét";const rs=[...new Set(es.flatMap(e=>e.r))];extra=`<div class="row" style="display:block">Termei: ${rs.map(x=>`<span class="tg" data-r="${x}">${esc(D.R[x].s)}</span>`).join("")||"–"}</div>`}
 else{title=D.C[st.sel];sub=es.length+" óra/hét";const ts=[...new Set(es.flatMap(e=>e.t))];extra=`<div class="row" style="display:block">Tanárai: ${ts.map(x=>`<span class="tg" data-t="${x}">${esc(D.T[x][0])}</span>`).join("")}</div>`}

 const bs=$("#bs");if(bs)bs.onchange=()=>{ov[D.R[st.sel].s]=bs.value;try{localStorage.setItem("umszki-b",JSON.stringify(ov))}catch(e){}all()}}

 if(st.tab==="r")b=B[bOf(D.R[i])];else{const e=es.find(e=>at(e,st.d,st.p));if(e&&e.r[0]!=null)b=B[bOf(D.R[e.r[0]])]}
